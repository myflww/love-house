[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-kb"
dynamic = ["version"]
description = "爱之屋：独立Agent长期记忆、模型协助整理、自动采集与动态神经星云可视化。"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "myflww" }]
keywords = [
  "knowledge-base", "graph", "memory", "rag", "mcp",
  "spreading-activation", "hebbian", "visualization",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries",
  "Intended Audience :: Developers",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.10", "build>=1.2"]

[project.scripts]
nkb = "nkb.cli.main:main"

[tool.setuptools]
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "nkb/viz/art/LICENSE.*", "assets/fonts/ark-pixel-OFL.txt", "extensions/deepseek-harness/licenses/yaml-ISC.txt"]

[tool.setuptools.dynamic]
version = { attr = "nkb._version.__version__" }

[tool.setuptools.packages.find]
include = ["nkb*"]

[tool.setuptools.package-data]
nkb = ["py.typed"]
"nkb.viz" = ["web/*.html", "web/*.js", "web/licenses/*.txt", "art/*.js", "art/LICENSE*"]
"nkb.service" = ["harness/*.py", "harness/*.json", "harness/*.md", "harness/LICENSE", "harness/NOTICE", "harness/dist/*.js", "harness/dist/*.txt"]

# ── 工具链（选装：make lint / make fmt） ──
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
files = ["nkb"]

[tool.coverage.run]
source = ["nkb"]
omit = ["nkb/viz/web/*"]
