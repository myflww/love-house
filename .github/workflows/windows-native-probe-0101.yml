name: Windows 0101 native acceptance probe
on:
  push:
    branches: [codex/windows-0101-native-probe]
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: desktop/requirements-windows.txt
      - name: Install pinned native inputs
        run: |
          python -m pip install -r desktop/requirements-windows.txt
          if ($LASTEXITCODE -ne 0) { throw 'Pinned native inputs failed' }
          python -m pip install -e .
          if ($LASTEXITCODE -ne 0) { throw 'Project installation failed' }
      - name: Verify upgrade contracts and journal concurrency before native checks
        run: |
          python -m unittest tests.test_usage_journal tests.test_windows_upgrade_smoke -v
          if ($LASTEXITCODE -ne 0) { throw 'Upgrade or journal regression failed' }
          python -c "import unittest; from tests.test_usage_journal import UsageJournalTests; suite=unittest.TestSuite(UsageJournalTests('test_parallel_duplicate_enqueues_accept_once_and_all_handles_close') for _ in range(20)); result=unittest.TextTestRunner().run(suite); raise SystemExit(not result.wasSuccessful())"
          if ($LASTEXITCODE -ne 0) { throw 'Repeated journal contention check failed' }
      - name: Verify the published old EXE reaches actual native window readiness
        env:
          LOVE_HOUSE_DISPOSABLE_UPGRADE_RUNNER: github-hosted
        run: |
          $oldSetup = Join-Path $env:RUNNER_TEMP 'LoveHouse-Setup-0.9.1rc1-Windows-x64.exe'
          Invoke-WebRequest -Uri 'https://github.com/myflww/love-house/releases/download/v0.9.1rc1/LoveHouse-Setup-0.9.1rc1-Windows-x64.exe' -OutFile $oldSetup
          if ((Get-FileHash -LiteralPath $oldSetup -Algorithm SHA256).Hash.ToLowerInvariant() -cne '56634d8e63e806c5d988302ed01678d2881a40e4c12f836a08ae1b361bccdad6') { throw 'Old setup bytes differ' }
          $env:LOVE_HOUSE_OLD_PROBE_SETUP = $oldSetup
          @'
          import os
          from scripts.windows_upgrade_smoke import App, OLD_VERSION, install, owned_fixture
          with owned_fixture() as root:
              target=root/'安装 App'
              install(os.environ['LOVE_HOUSE_OLD_PROBE_SETUP'],target)
              app=App(target/'LoveHouse.exe',root/'合成 数据')
              try:
                  app.start(OLD_VERSION)
                  assert app.request('/api/health')['version']==OLD_VERSION
                  app.close()
              finally:app.close(strict=False)
          assert not root.exists()
          print('Public old EXE actual native readiness and cleanup passed')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Published old EXE native readiness failed' }
      - name: Exercise actual WebView2 with isolated synthetic data
        run: |
          New-Item -ItemType Directory -Force build/native-probe | Out-Null
          python desktop/windows_app.py --smoke-test --report build/native-probe/native.json
          $code = $LASTEXITCODE
          if (Test-Path -LiteralPath build/native-probe/native.json) { Get-Content -LiteralPath build/native-probe/native.json -Raw }
          if ($code -ne 0) { throw 'Actual native acceptance failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-0101-native-probe
          path: build/native-probe/
          if-no-files-found: ignore
          retention-days: 3
