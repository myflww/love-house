name: Create verified macOS 0.9.2 source tag
on:
  push:
    branches: [codex/tag-macos-092]
permissions:
  contents: write
jobs:
  create-source-tag:
    if: github.repository == 'myflww/love-house' && github.actor == 'myflww'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Create only the absent fixed source tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          base='https://api.github.com/repos/myflww/love-house/git/'
          target='9bf515f5b18d43d7948e9b35a9997c394fcffd2a'
          def call(path, method='GET', body=None):
              request=urllib.request.Request(base+path, method=method, data=None if body is None else json.dumps(body).encode(), headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request, timeout=25) as response: return json.load(response)
          original090=call('refs/tags/v0.9.0')['object']['sha']
          created=False
          try: before=call('refs/tags/v0.9.2')
          except urllib.error.HTTPError as error:
              if error.code!=404: raise
              call('refs','POST',{'ref':'refs/tags/v0.9.2','sha':target})
              created=True
          else:
              assert before['ref']=='refs/tags/v0.9.2' and before['object']['type']=='commit' and before['object']['sha']==target, 'Tag already exists at another target; no overwrite performed'
          after=call('refs/tags/v0.9.2')
          assert after['ref']=='refs/tags/v0.9.2' and after['object']['type']=='commit' and after['object']['sha']==target, 'New tag target not verified'
          assert call('refs/tags/v0.9.0')['object']['sha']==original090, 'Previous release tag changed independently'
          print(json.dumps({'ref':after['ref'],'created':created,'verified_target':after['object']['sha'],'previous_release_tag_unchanged':True,'release_assets_untouched':True}))
          PY
