name: Build supplemental Android 0.10.6 original-signer QA
on:
  push:
    branches: [codex/android-0106-original-signing]
    paths: ['qa/android-0106-extra/**', '.github/workflows/android-0106-build-extraqa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: gradle -p qa/android-0106-extra --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-0106-extraqa-unsigned-input
          path: qa/android-0106-extra/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
