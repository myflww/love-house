name: Android offline APK verification

on:
  push:
    branches: [codex/android-preview]
    paths:
      - 'android/**'
      - 'mobile/**'
      - 'scripts/prepare_mobile_assets.py'
      - 'scripts/prepare_public_release.py'
      - 'scripts/check_android_test_results.py'
      - 'scripts/run_android_smoke.sh'
      - 'tests/test_android_packaging.py'
      - '.github/workflows/android.yml'
      - 'LICENSE'
      - 'NOTICE'
      - 'THIRD_PARTY_NOTICES.md'
  pull_request:
    paths:
      - 'android/**'
      - 'mobile/**'
      - 'scripts/prepare_mobile_assets.py'
      - 'scripts/prepare_public_release.py'
      - 'scripts/check_android_test_results.py'
      - 'scripts/run_android_smoke.sh'
      - 'tests/test_android_packaging.py'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api-level: [28, 36]
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Initialize Android SDK and command-line tools on PATH
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'
      - name: Check safe packaging and create local WebView assets
        run: |
          python -m unittest tests.test_android_packaging tests.test_public_release -v
          node --test mobile/tests/store.test.mjs
          python -m unittest discover -s mobile/tests -p 'test_*.py' -v
          python scripts/prepare_mobile_assets.py
      - name: Install the pinned Android SDK components
        run: |
          command -v sdkmanager
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Assemble debug test package and unsigned release
        run: gradle -p android --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:lintRelease
      - name: Enable KVM access on this disposable Linux runner
        run: |
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run real Android WebView and storage instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -camera-back none
          script: bash scripts/run_android_smoke.sh
      - name: Preserve unsigned APK and developer signing tools after tests pass
        run: |
          set -euo pipefail
          apk='android/app/build/outputs/apk/release/app-release-unsigned.apk'
          test -f "$apk"
          test_apk='android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk'
          test -f "$test_apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$apk"
          # The application is Java/WebView only and must remain ABI-universal.
          if unzip -Z1 "$apk" | grep -E '^lib/[^/]+/[^/]+\.so$'; then
            echo 'Unexpected native dependency in the universal Android APK' >&2
            exit 1
          fi
          mkdir -p build/android/signing-tools
          cp "$apk" build/android/LoveHouse-0.1.0-preview1-Android-unsigned.apk
          # Developer-only test harness: the persistent local key can re-sign
          # this alongside the final APK to verify that exact release build.
          cp "$test_apk" build/android/LoveHouse-Android-instrumentation-test.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" build/android/signing-tools/apksigner.jar
          if [[ -f "$ANDROID_HOME/build-tools/36.0.0/NOTICE.txt" ]]; then
            cp "$ANDROID_HOME/build-tools/36.0.0/NOTICE.txt" build/android/signing-tools/Android-Build-Tools-NOTICE.txt
          fi
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md build/android/
          printf '%s\n' 'This is a developer artifact, not an installable public release.' 'The APK is unsigned. Keep private signing keys outside Git and sign the verified APK with a persistent key.' 'apksigner.jar is an Android SDK Build-Tools developer utility; preserve its upstream licence notices.' > build/android/README-UNSIGNED.txt
          (cd build/android && sha256sum LoveHouse-0.1.0-preview1-Android-unsigned.apk signing-tools/apksigner.jar) > build/android/SHA256SUMS.txt
          python -c "import json,os,pathlib; pathlib.Path('build/android/verification.json').write_text(json.dumps({'schema':'love-house-android-build/v1','source_commit':os.environ['GITHUB_SHA'],'api_level':int('${{ matrix.api-level }}'),'instrumentation':'passed','artifact':'unsigned_not_for_distribution','version_name':'0.1.0-preview1','version_code':1,'min_sdk':26,'target_sdk':36,'no_native_libraries':True},indent=2)+'\n',encoding='utf-8')"
      - uses: actions/upload-artifact@v4
        with:
          name: android-unsigned-api-${{ matrix.api-level }}
          path: build/android/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-evidence-api-${{ matrix.api-level }}
          path: |
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
