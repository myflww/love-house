name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 单元测试
        run: python -m unittest discover -s tests -v

      - name: 安装（顺便验证打包）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: 自检
        run: |
          python -m nkb init --demo -b /tmp/brain.json
          python -m nkb doctor -b /tmp/brain.json

      - name: 冒烟（建库 → 检索 → 导入 → 导出）
        run: |
          python -m nkb stats -b /tmp/brain.json
          python -m nkb recall "为什么不用向量库" -b /tmp/brain.json
          python -m nkb add "冒烟节点" --text "来自 CI" -b /tmp/brain.json
          python -m nkb ingest examples/seed -b /tmp/brain.json
          python -m nkb forget -b /tmp/brain.json
          python -m nkb viz -b /tmp/brain.json --out /tmp/brain.html
          test -s /tmp/brain.html

      - name: MCP 握手
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05"}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
          | python -m nkb mcp -b /tmp/brain.json | tee /tmp/mcp.out
          grep -q '"name": "neural-kb"' /tmp/mcp.out
          grep -q 'kb_recall' /tmp/mcp.out

      - name: 示例脚本
        run: |
          python examples/01_quickstart.py
          python examples/02_ingest_docs.py
          python examples/03_wire_to_llm.py
          python examples/04_custom_encoder.py
