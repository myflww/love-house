name: Android 0.8 original-signature upgrade acceptance
on:
  push:
    branches: [codex/android-080rc1-original-signing]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: original-android-080-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [28, 36]
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'
      - name: Check exact signed files and build the isolated upgrade probe
        run: |
          python -m unittest tests.test_verify_signed_080 tests.test_publish_signed_080 -v
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          python scripts/verify_signed_080.py --verify-only
          gradle -p qa/android-upgrade --no-daemon :app:assembleDebug
      - name: Enable disposable runner KVM
        run: |
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Preserve old memories through signed replacement and exercise release
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -camera-back none
          script: python scripts/verify_signed_080.py --run --api-level ${{ matrix.api }}
      - uses: actions/upload-artifact@v4
        with:
          name: original-signed-080-api-${{ matrix.api }}
          path: |
            build/android080/LoveHouse-0.8.0rc1-Android.apk
            build/android080/verification.json
            build/android080/upgrade-seed.txt
            build/android080/upgrade-verify.txt
            build/android080/instrumentation.txt
            build/android080/android-smoke.png
          if-no-files-found: error
      - name: Preserve bounded failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: original-signed-080-failure-${{ matrix.api }}
          path: |
            build/android080/verification.json
            build/android080/upgrade-seed.txt
            build/android080/upgrade-verify.txt
            build/android080/instrumentation.txt
          if-no-files-found: ignore
  publish:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/android-080rc1-original-signing'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: original-signed-080-api-28
          path: build/android080-artifacts/api-28
      - uses: actions/download-artifact@v4
        with:
          name: original-signed-080-api-36
          path: build/android080-artifacts/api-36
      - name: Append verified Android assets to the existing preview release
        run: python scripts/publish_signed_080.py
