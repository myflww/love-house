name: Windows installer release

on:
  pull_request:
    paths:
      - 'nkb/**'
      - 'desktop/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/release.yml'
      - '.gitattributes'
      - 'assets/**'
      - 'pyproject.toml'
  push:
    tags: ['v*']
    branches: [main, codex/windows-051-fix]
    paths:
      - 'nkb/**'
      - 'desktop/**'
      - 'tests/**'
      - 'scripts/build_windows.py'
      - 'scripts/fetch_windows_runtime.py'
      - '.github/workflows/release.yml'
      - '.gitattributes'
      - 'assets/**'
      - 'pyproject.toml'
      - 'LICENSE'
      - 'NOTICE'
      - 'THIRD_PARTY_NOTICES.md' 
      - 'docs/releases/**'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag, matching nkb/_version.py'
        required: true
        default: 'v0.5.1rc1'
        type: string
      publish:
        description: 'Upload successful Windows builds to the public release'
        default: false
        type: boolean
      consumer_validation_evidence:
        description: 'URL of completed clean Windows consumer acceptance evidence (required to publish)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      preview_requested: ${{ steps.version.outputs.preview_requested }}
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: desktop/requirements-windows.txt
      - name: Verify release version and build tools
        id: version
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
          PREVIEW_REQUESTED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/codex/windows-051-fix' && contains(github.event.head_commit.message, '[public-windows-preview]') }}
        run: |
          $version = python -c "from nkb._version import __version__; print(__version__)"
          if ($LASTEXITCODE -ne 0) { throw 'Could not read product version' }
          if ($env:REQUESTED_TAG -and $env:REQUESTED_TAG -ne "v$version") { throw "Tag and project version differ" }
          if ($env:PREVIEW_REQUESTED -eq 'true' -and $version -ne '0.5.1rc1') { throw 'Public Windows preview must use its independent 0.5.1rc1 version' }
          "release_tag=v$version" >> $env:GITHUB_OUTPUT
          "preview_requested=$($env:PREVIEW_REQUESTED)" >> $env:GITHUB_OUTPUT
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) { throw 'Official Inno Setup 6 is required on the runner' }
      - name: Install pinned build inputs
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop/requirements-windows.txt
          python -m pip install -e .
      - name: Record actual runner prerequisites and fetch verified offline repair component
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/windows/reports | Out-Null
          python -c "import json; from desktop.windows_prerequisites import runtime_status, dotnet_status; r=runtime_status(); print(json.dumps({'system_runtime_preinstalled':r['available'],'runtime':r,'dotnet':dotnet_status(),'environment':'github_hosted_runner','clean_consumer_validation':False}))" > build/windows/reports/runner-prerequisites.json
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect runner prerequisites' }
          python scripts/fetch_windows_runtime.py
          if ($LASTEXITCODE -ne 0) { throw 'Microsoft runtime verification failed' }
      - name: Full regression tests and desktop adapter tests
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Project regression tests failed' }
          python -m unittest discover -s desktop -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Desktop adapter regression tests failed' }
      - name: Build GUI, console adapters, native smoke and installer
        run: python scripts/build_windows.py
      - name: Install into disposable folder and verify installed executables
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/release/LoveHouse-Setup-*-Windows-x64.exe | Select-Object -First 1
          $target = Join-Path $env:RUNNER_TEMP '爱之屋 Installed Path'
          $process = Start-Process $setup.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$target`"") -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(300000)) { $process.Kill($true); throw 'Installer timed out' }
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          if (-not (Test-Path "$target\bridge\LoveHouseBridge.exe")) { throw 'Console bridge missing from installed app' }
          $report = Join-Path $env:RUNNER_TEMP 'installed-backend.json'
          Remove-Item -LiteralPath $report -ErrorAction SilentlyContinue
          $process = Start-Process "$target\LoveHouse.exe" -ArgumentList @('--backend-smoke','--report',"`"$report`"") -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(150000)) { $process.Kill($true); throw 'Installed backend smoke timed out' }
          if ($process.ExitCode -ne 0 -or -not (Test-Path $report)) { throw 'Installed backend smoke failed' }
          $backendResult = Get-Content $report | ConvertFrom-Json
          if ($backendResult.ok -isnot [bool] -or $backendResult.ok -ne $true -or $backendResult.process_complete -isnot [bool] -or $backendResult.process_complete -ne $true) { throw 'Installed backend report is not finalized success' }
          $native = Join-Path $env:RUNNER_TEMP 'installed-native.json'
          Remove-Item -LiteralPath $native -ErrorAction SilentlyContinue
          $process = Start-Process "$target\LoveHouse.exe" -ArgumentList @('--smoke-test','--report',"`"$native`"") -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(150000)) { $process.Kill($true); throw 'Installed native smoke timed out' }
          if ($process.ExitCode -ne 0 -or -not (Test-Path $native)) { throw 'Installed native smoke failed' }
          $nativeResult = Get-Content $native | ConvertFrom-Json
          if ($nativeResult.ok -isnot [bool] -or $nativeResult.ok -ne $true -or $nativeResult.process_complete -isnot [bool] -or $nativeResult.process_complete -ne $true) { throw 'Installed native report is not finalized success' }
          $diagDir = Join-Path $env:RUNNER_TEMP 'LoveHouseDiagnostics'
          $process = Start-Process "$target\LoveHouse.exe" -ArgumentList @('--diagnose','--data-dir',"`"$diagDir`"") -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(30000)) { $process.Kill($true); throw 'Installed diagnostics timed out' }
          if ($process.ExitCode -ne 0) { throw 'Installed diagnose mode failed' }
          $diag = Get-ChildItem "$diagDir\logs\diagnostics-*.txt" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $diag) { throw 'Diagnose mode wrote no runtime report' }
          $diagText = Get-Content $diag.FullName -Raw
          if ($diagText -notmatch 'WebView2' -or $diagText -notmatch 'Release') { throw 'Diagnose report is missing runtime facts' }
          if ($diagText -match 'brain\.json' -or $diagText -match '"assistant"') { throw 'Diagnose report leaked memory content' }
          Copy-Item $diag.FullName build/windows/reports/installed-diagnostics.txt
          Copy-Item $report build/windows/reports/installed-backend.json
          Copy-Item $native build/windows/reports/installed-native.json
      - name: Verify portable and installed GUI without developer PATH and with polluted environment
        shell: pwsh
        run: |
          $variables = @('PATH','LOCALAPPDATA','TEMP','TMP','PYTHONHOME','PYTHONPATH','PYTHONNET_RUNTIME','PYTHONNET_PYDLL','WEBVIEW2_BROWSER_EXECUTABLE_FOLDER','WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS')
          $saved = @{}
          foreach ($name in $variables) { $saved[$name] = [Environment]::GetEnvironmentVariable($name, 'Process') }
          $scratch = Join-Path $env:RUNNER_TEMP '爱之屋 Consumer Data'
          $reports = Join-Path $env:GITHUB_WORKSPACE 'build/windows/reports'
          New-Item -ItemType Directory -Force $scratch | Out-Null
          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            $env:LOCALAPPDATA = Join-Path $scratch '本地 数据'
            $env:TEMP = Join-Path $scratch '临时 文件'
            $env:TMP = $env:TEMP
            New-Item -ItemType Directory -Force $env:LOCALAPPDATA,$env:TEMP | Out-Null
            $env:PYTHONHOME = 'C:\invalid-lovehouse-python-home'
            $env:PYTHONPATH = 'C:\invalid-lovehouse-python-path'
            $env:PYTHONNET_RUNTIME = 'invalid-lovehouse-runtime'
            $env:PYTHONNET_PYDLL = 'C:\invalid-lovehouse-python.dll'
            $env:WEBVIEW2_BROWSER_EXECUTABLE_FOLDER = 'C:\invalid-lovehouse-webview'
            $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--invalid-lovehouse-argument'
            $apps = @{
              portable = (Join-Path $env:GITHUB_WORKSPACE 'dist/windows/LoveHouse/LoveHouse.exe')
              installed = (Join-Path $env:RUNNER_TEMP '爱之屋 Installed Path\LoveHouse.exe')
            }
            foreach ($name in $apps.Keys) {
              $report = Join-Path $reports "$name-consumer.json"
              Remove-Item -LiteralPath $report -ErrorAction SilentlyContinue
              $process = Start-Process $apps[$name] -ArgumentList @('--consumer-smoke','--report',"`"$report`"") -WindowStyle Hidden -PassThru
              if (-not $process.WaitForExit(150000)) {
                $process.Kill($true)
                throw "$name consumer GUI timed out"
              }
              if ($process.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $report)) { throw "$name consumer GUI failed" }
              $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
              if ($result.ok -isnot [bool] -or $result.ok -ne $true -or $result.process_complete -isnot [bool] -or $result.process_complete -ne $true) { throw "$name consumer report is not finalized success" }
            }
          } finally {
            foreach ($name in $variables) { [Environment]::SetEnvironmentVariable($name, $saved[$name], 'Process') }
          }
      - name: Upload tested Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: love-house-windows-x64
          path: |
            dist/release/*Windows-x64.exe
            dist/release/*Windows-x64.zip
            dist/release/Windows-SHA256SUMS.txt
          if-no-files-found: error
      - name: Preserve disposable test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-evidence
          path: build/windows/reports/
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: windows
    # The explicit branch marker publishes an independently versioned preview.
    # Stable publication still requires completed clean-consumer evidence.
    if: needs.windows.outputs.preview_requested == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ needs.windows.outputs.release_tag }}
      preview: ${{ needs.windows.outputs.preview_requested }}
      created_preview: ${{ steps.preview.outputs.created_preview }}
      release_id: ${{ steps.preview.outputs.release_id }}
      checksums_sha256: ${{ steps.publish.outputs.checksums_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: love-house-windows-x64
          path: windows-release
      - name: Create this run's private preview draft
        id: preview
        if: needs.windows.outputs.preview_requested == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.windows.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" == v0.5.1rc1 ]] || { echo 'Unexpected preview tag' >&2; exit 1; }
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Preview release already exists; use a new preview version instead of overwriting published assets.' >&2
            exit 1
          fi
          cp docs/releases/windows-0.5.1rc1.md release-notes.txt
          printf '\n\n公开下载复验和报告：[本次工作流](%s/%s/actions/runs/%s)。\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> release-notes.txt
          gh release create "$RELEASE_TAG" --title '爱之屋 0.5.1rc1 · Windows 公开预览' --notes-file release-notes.txt --target "$GITHUB_SHA" --draft --prerelease --latest=false
          echo 'created_preview=true' >> "$GITHUB_OUTPUT"
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.id')
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
      - name: Attach verified Windows assets
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.windows.outputs.release_tag }}
          PREVIEW: ${{ needs.windows.outputs.preview_requested }}
          CONSUMER_VALIDATION_EVIDENCE: ${{ inputs.consumer_validation_evidence }}
        shell: bash
        run: |
          set -euo pipefail
          checksums_sha256=$(sha256sum windows-release/Windows-SHA256SUMS.txt | cut -d ' ' -f1)
          echo "checksums_sha256=$checksums_sha256" >> "$GITHUB_OUTPUT"
          if [[ "$PREVIEW" == true ]]; then
            [[ "$RELEASE_TAG" == v0.5.1rc1 ]] || { echo 'Unexpected preview tag' >&2; exit 1; }
            # Upload completely as a draft before making any asset public.
            gh release upload "$RELEASE_TAG" windows-release/*
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            if [[ "$CONSUMER_VALIDATION_EVIDENCE" != https://* ]]; then
              echo 'Stable publication requires an HTTPS link to completed clean Windows consumer acceptance evidence.' >&2
              exit 1
            fi
            if [[ "$RELEASE_TAG" == *rc* || "$RELEASE_TAG" == *alpha* || "$RELEASE_TAG" == *beta* ]]; then
              echo 'A preview version cannot be published through the stable path.' >&2
              exit 1
            fi
            if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            printf '%s\n\n%s\n' '爱之屋公开下载版本。项目原创代码仅限非商用；第三方组件遵守各自许可证。Windows 构建和安装后测试报告见本次工作流。' "Windows 消费者环境验收记录：$CONSUMER_VALIDATION_EVIDENCE" > release-notes.txt
            gh release create "$RELEASE_TAG" --title "爱之屋 ${RELEASE_TAG#v}" --notes-file release-notes.txt --target "$GITHUB_SHA"
            fi
            existing=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
            for asset in windows-release/*; do
              name=$(basename "$asset")
              if printf '%s\n' "$existing" | grep -Fxq "$name"; then
                echo "Refusing to overwrite historical release asset: $name" >&2
                exit 1
              fi
            done
            gh release upload "$RELEASE_TAG" windows-release/*
          fi
  verify_public_download:
    needs: [windows, publish]
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      public_verified: ${{ steps.public_check.outputs.public_verified }}
    steps:
      # Deliberately no checkout, setup-python, artifact download or auth token:
      # these tests use the files an anonymous user can actually download.
      - name: Download public assets anonymously, verify SHA256 and run distributed applications
        id: public_check
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.publish.outputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_CHECKSUMS_SHA256: ${{ needs.publish.outputs.checksums_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_TAG -replace '^v',''
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:rc[0-9]+)?$') { throw 'Invalid release version' }
          $download = Join-Path $env:RUNNER_TEMP '爱之屋 Public Download'
          $reports = Join-Path $env:RUNNER_TEMP 'love-house-public-reports'
          New-Item -ItemType Directory -Force $download,$reports | Out-Null
          $setupName = "LoveHouse-Setup-$version-Windows-x64.exe"
          $zipName = "LoveHouse-$version-Windows-x64.zip"
          foreach ($name in @('Windows-SHA256SUMS.txt',$setupName,$zipName)) {
            $url = "https://github.com/$env:REPOSITORY/releases/download/$env:RELEASE_TAG/$name"
            $file = Join-Path $download $name
            & "$env:SystemRoot\System32\curl.exe" --disable --fail --location --silent --show-error --retry 3 --retry-delay 3 --connect-timeout 30 --max-time 600 --proto '=https' --proto-redir '=https' $url --output $file
            if ($LASTEXITCODE -ne 0) { throw "Anonymous public download failed: $name" }
          }
          $manifestHash = (Get-FileHash -LiteralPath (Join-Path $download 'Windows-SHA256SUMS.txt') -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($env:EXPECTED_CHECKSUMS_SHA256 -notmatch '^[a-f0-9]{64}$' -or $manifestHash -ne $env:EXPECTED_CHECKSUMS_SHA256) { throw 'Public checksum file differs from the tested build' }
          $checksums = @{}
          foreach ($line in Get-Content -LiteralPath (Join-Path $download 'Windows-SHA256SUMS.txt')) {
            if ($line -notmatch '^([a-fA-F0-9]{64})  ([^\\/]+)$') { throw 'Malformed SHA256 manifest' }
            if ($checksums.ContainsKey($Matches[2])) { throw 'Duplicate checksum entry' }
            $checksums[$Matches[2]] = $Matches[1].ToLowerInvariant()
          }
          if ($checksums.Count -ne 2 -or -not $checksums.ContainsKey($setupName) -or -not $checksums.ContainsKey($zipName)) { throw 'SHA256 manifest does not exactly describe this release' }
          foreach ($name in @($setupName,$zipName)) {
            $actual = (Get-FileHash -LiteralPath (Join-Path $download $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $checksums[$name]) { throw "Public download SHA256 mismatch: $name" }
          }
          $checksums | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $reports 'public-sha256.json') -Encoding utf8
          $portable = Join-Path $download '完整解压 Portable'
          Expand-Archive -LiteralPath (Join-Path $download $zipName) -DestinationPath $portable
          $portableExe = Join-Path $portable 'LoveHouse\LoveHouse.exe'
          if (-not (Test-Path -LiteralPath $portableExe)) { throw 'Downloaded ZIP has no complete application' }
          $target = Join-Path $env:RUNNER_TEMP '爱之屋 Public Installed'
          function Invoke-PublicSmoke([string]$Executable,[string]$Mode,[string]$Name) {
            $report = Join-Path $reports "$Name.json"
            Remove-Item -LiteralPath $report -ErrorAction SilentlyContinue
            $process = Start-Process -FilePath $Executable -ArgumentList @($Mode,'--report',"`"$report`"") -WindowStyle Hidden -PassThru
            if (-not $process.WaitForExit(150000)) { $process.Kill($true); throw "$Name timed out" }
            if ($process.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $report)) { throw "$Name exited unsuccessfully" }
            $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
            if ($result.ok -isnot [bool] -or $result.ok -ne $true -or $result.process_complete -isnot [bool] -or $result.process_complete -ne $true) { throw "$Name did not finalize successfully" }
            return $result
          }
          $variables = @('PATH','LOCALAPPDATA','TEMP','TMP','PYTHONHOME','PYTHONPATH','PYTHONNET_RUNTIME','PYTHONNET_PYDLL','WEBVIEW2_BROWSER_EXECUTABLE_FOLDER','WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS')
          $saved = @{}
          foreach ($name in $variables) { $saved[$name] = [Environment]::GetEnvironmentVariable($name, 'Process') }
          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            $env:LOCALAPPDATA = Join-Path $download '本地 数据'
            $env:TEMP = Join-Path $download '临时 文件'
            $env:TMP = $env:TEMP
            New-Item -ItemType Directory -Force $env:LOCALAPPDATA,$env:TEMP | Out-Null
            $env:PYTHONHOME = 'C:\invalid-lovehouse-python-home'
            $env:PYTHONPATH = 'C:\invalid-lovehouse-python-path'
            $env:PYTHONNET_RUNTIME = 'invalid-lovehouse-runtime'
            $env:PYTHONNET_PYDLL = 'C:\invalid-lovehouse-python.dll'
            $env:WEBVIEW2_BROWSER_EXECUTABLE_FOLDER = 'C:\invalid-lovehouse-webview'
            $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--invalid-lovehouse-argument'
            $runtime = Invoke-PublicSmoke $portableExe '--runtime-status' 'public-runtime'
            @{environment='github_hosted_runner';os=[Environment]::OSVersion.VersionString;system_runtime_preinstalled=$runtime.runtime.available;clean_consumer_validation=$false;anonymous_public_download=$true} | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $reports 'public-runner.json') -Encoding utf8
            $process = Start-Process -FilePath (Join-Path $download $setupName) -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$target`"") -WindowStyle Hidden -PassThru
            if (-not $process.WaitForExit(300000)) { $process.Kill($true); throw 'Public installer timed out' }
            if ($process.ExitCode -ne 0) { throw "Public installer failed: $($process.ExitCode)" }
            $installedExe = Join-Path $target 'LoveHouse.exe'
            if (-not (Test-Path -LiteralPath (Join-Path $target 'bridge\LoveHouseBridge.exe'))) { throw 'Public install is incomplete' }
            $null = Invoke-PublicSmoke $installedExe '--backend-smoke' 'public-installed-backend'
            $null = Invoke-PublicSmoke $installedExe '--smoke-test' 'public-installed-native'
            $null = Invoke-PublicSmoke $installedExe '--consumer-smoke' 'public-installed-consumer'
            $null = Invoke-PublicSmoke $portableExe '--consumer-smoke' 'public-portable-consumer'
          } finally {
            foreach ($name in $variables) { [Environment]::SetEnvironmentVariable($name, $saved[$name], 'Process') }
          }
          'public_verified=true' >> $env:GITHUB_OUTPUT
          "Anonymous public installer and ZIP verification passed: https://github.com/$env:REPOSITORY/releases/tag/$env:RELEASE_TAG" >> $env:GITHUB_STEP_SUMMARY
      - name: Preserve actual public download verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-public-download-evidence
          path: ${{ runner.temp }}/love-house-public-reports/
          if-no-files-found: ignore
          retention-days: 30
      - name: Read platform release guidance after successful public verification
        if: success() && needs.publish.outputs.preview == 'true'
        uses: actions/checkout@v4
        with:
          path: release-guidance
      - name: Update historical release platform guidance without changing its assets
        if: success() && needs.publish.outputs.preview == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $notes = 'release-guidance/docs/releases/v0.5.0-platform-notes.md'
          if (-not (Test-Path -LiteralPath $notes)) { throw 'Reviewed historical platform guidance is missing' }
          gh release edit v0.5.0 --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw 'Historical platform notes update failed' }

  withdraw_failed_preview:
    needs: [windows, publish, verify_public_download]
    # A separate runner can still withdraw a preview when verification fails to
    # start or is cancelled. Only the release created by this run is eligible.
    if: always() && needs.publish.outputs.created_preview == 'true' && needs.publish.outputs.preview == 'true' && needs.verify_public_download.outputs.public_verified != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Return the unsuccessful preview to draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.publish.outputs.release_tag }}
          RELEASE_ID: ${{ needs.publish.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" == v0.5.1rc1 && "$RELEASE_ID" =~ ^[0-9]+$ ]] || { echo 'Refusing to change an unrelated release' >&2; exit 1; }
          release=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID")
          jq -e --arg tag "$RELEASE_TAG" '.tag_name == $tag and .prerelease == true' <<< "$release" >/dev/null
          gh release edit "$RELEASE_TAG" --draft=true --latest=false
