name: Android 0.8.0rc2 original-key upgrade acceptance
on:
  push:
    branches: [codex/workbuddy-signed-080rc2]
    paths:
      - scripts/android-080rc2-signing-candidate.json
      - scripts/verify_signed_080rc2.py
      - tests/test_verify_signed_080rc2.py
      - android/upgrade-qa/**
      - .github/workflows/android-original-signing-080rc2.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: original-android-080rc2-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [28, 36]
        from: [1, 2]
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'
      - name: Check signed metadata, source freeze and build isolated probe
        run: |
          python -m unittest tests.test_verify_signed_080rc2 -v
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          python scripts/verify_signed_080rc2.py --verify-only
          gradle -p android/upgrade-qa --no-daemon :app:assembleDebug
      - name: Enable disposable runner KVM
        run: |
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify in-place upgrade and original memory preservation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -camera-back none
          script: python scripts/verify_signed_080rc2.py --run --api-level ${{ matrix.api }} --from-version-code ${{ matrix.from }}
      - uses: actions/upload-artifact@v4
        with:
          name: original-signed-080rc2-api-${{ matrix.api }}-from-${{ matrix.from }}
          path: |
            build/android080rc2/LoveHouse-0.8.0rc2-Android.apk
            build/android080rc2/verification.json
            build/android080rc2/upgrade-seed.txt
            build/android080rc2/upgrade-verify.txt
            build/android080rc2/instrumentation.txt
            build/android080rc2/android-smoke.png
          if-no-files-found: error
      - name: Preserve bounded failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: original-signed-080rc2-failure-api-${{ matrix.api }}-from-${{ matrix.from }}
          path: |
            build/android080rc2/verification.json
            build/android080rc2/upgrade-seed.txt
            build/android080rc2/upgrade-verify.txt
            build/android080rc2/instrumentation.txt
          if-no-files-found: ignore
